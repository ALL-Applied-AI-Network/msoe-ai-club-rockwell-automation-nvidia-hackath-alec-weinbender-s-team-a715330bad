[project]
name = "sim-server"
version = "0.1.0"
description = "HTTP grasp-evaluation service that runs next to Isaac Sim"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "imageio-ffmpeg>=0.5",  # recordings: H.264 mp4 through its bundled ffmpeg (the GPU machines have none)
    "uvicorn[standard]>=0.29",  # Isaac Sim 6.0.1's pip install pins uvicorn 0.29.0 (the GB10)
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
