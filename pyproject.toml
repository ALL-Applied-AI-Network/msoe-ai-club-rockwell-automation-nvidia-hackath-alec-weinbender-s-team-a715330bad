# uv workspace root: member list, shared tool config and dev tools. No [project] table.
# Each component has its own pyproject.toml; see .claude/rules/coding-style.md.
# The vendored twin (sim/fanuc_er4ia_sim) is not a member and keeps its own requirements.txt.
[tool.uv.workspace]
members = ["app/backend", "sim/sim_server"]

# PyTorch (BoTorch needs it) comes from its CPU-only index: the optimizer fits small GPs on the CPU, and the default Linux
# wheels bring several GB of CUDA libraries the backend never uses. Isaac keeps its own torch on the GPU machine.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["app/backend/src", "sim/sim_server/src"]   # first-party packages for import sorting
extend-exclude = ["sim/fanuc_er4ia_sim"]   # vendored upstream starter

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "G"]   # G: log calls take arguments, not f-strings

[tool.pytest.ini_options]
testpaths = ["app/backend/tests", "sim/sim_server/tests"]   # sim tests run without Isaac
addopts = ["--import-mode=importlib", "-m", "not integration"]
markers = ["integration: needs a real LLM or the sim server; deselected by default (run with -m integration)"]
filterwarnings = ["ignore:`torch.jit.script` is deprecated:FutureWarning"]   # raised by gpytorch's imports, not our code

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
