# Written by cell_policy/make_placement.py. Every rollout has the same objects in the same place; only the prompt
# changes: its [c2f ...] tag is the grasp offset policy.py commands (the app's test-plan offset), so the operator
# places the cube and the bin the same way each time. A cube's position is its centre.
rollouts:
  - objects:                                     # rollout 1
      cube_16mm: [420, -40, 0]
      bin: [480, 120, 0]
    prompt: "Put the 16 mm cube into the yellow bin. [c2f trial=R01 dx=+0.00 dy=+0.00 dyaw=+0.0 cube=420,-40,0 bin=480,120,0 tip=2.5]"
