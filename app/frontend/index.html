<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Finger Designer</title>
<style>
:root{color-scheme:light;
  --bg:#f1f1f1;--card:#ffffff;--ink:#111111;--mute:#5b5b5b;--line:#dadada;--soft:#efefef;
  --acc:#76b900;--acc-ink:#000;--acc-text:#3f6b00;--brand:#cd163f;
  --ok:#3f6b00;--warn:#a85d00;--bad:#cd163f;--llm:#cd163f;--opt:#5a9400;--best:#111;
  --font:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:8px;--gap:16px;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a0a0a;--card:#151515;--ink:#f2f2f2;--mute:#a3a3a3;--line:#2b2b2b;--soft:#1e1e1e;
  --acc-text:#76b900;--ok:#76b900;--warn:#f0a53a;--bad:#ff5a78;--llm:#ff5a78;--opt:#76b900;--best:#f2f2f2;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a0a0a;--card:#151515;--ink:#f2f2f2;--mute:#a3a3a3;--line:#2b2b2b;--soft:#1e1e1e;
  --acc-text:#76b900;--ok:#76b900;--warn:#f0a53a;--bad:#ff5a78;--llm:#ff5a78;--opt:#76b900;--best:#f2f2f2;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--acc-text);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mute{color:var(--mute)}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--card);border-bottom:3px solid var(--brand);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em;margin-right:auto}
.top .ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin:0}
.top select{width:auto;padding:4px 6px;font-size:12px}
.chip{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
label{display:block;font-size:12px;font-weight:500;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=file]{padding:5px}input[type=file]::file-selector-button{margin-right:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:5px;padding:4px 10px;font:inherit;cursor:pointer}
button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:550;cursor:pointer}
button:hover{filter:brightness(1.08)}button.sec{background:transparent;color:var(--acc-text);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.span2{grid-column:span 2}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2,.sec-h{font-size:12px;margin:0 0 12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
#app{max-width:1500px;margin:auto;padding:var(--gap);display:grid;grid-template-columns:350px minmax(0,1fr);gap:var(--gap);align-items:start}
#intro{display:flex;flex-direction:column;gap:var(--gap);position:sticky;top:calc(var(--hh,53px) + var(--gap));max-height:calc(100vh - var(--hh,53px) - 2*var(--gap));overflow:auto}
.spy:empty{display:none}
@media(max-width:900px){#app{grid-template-columns:minmax(0,1fr)}#intro{position:static;max-height:none}}
#right{min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.spy{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;scrollbar-width:none}
#spywrap{position:sticky;top:var(--hh,53px);z-index:19;background:var(--bg);padding-top:8px}
#spywrap:has(#spy:empty){display:none}
.spy::-webkit-scrollbar{display:none}
.spy a{color:var(--mute);padding:11px 12px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;font-size:13px}
.spy a:hover{color:var(--ink);text-decoration:none}.spy a.on{color:var(--ink);border-color:var(--acc);font-weight:650}
.spy .close{margin-left:auto;padding:4px 10px;font-size:12px;white-space:nowrap;flex:none}
.card.sec,#pane-new,#pane-jobs{scroll-margin-top:calc(var(--hh,53px) + 64px)}
html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.job{padding:10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin:0 -4px}.job:hover,.job.sel{background:var(--soft)}.job.sel{border-color:var(--line)}
.job b{font-weight:600}.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.bar.done i{background:var(--ok)}.bar.failed i,.bar.cancelled i,.bar.interrupted i{background:var(--warn)}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor;color:var(--mute);margin-left:8px;vertical-align:1px}
.pill.done{color:var(--ok)}.pill.failed{color:var(--bad)}.pill.running,.pill.queued{color:var(--acc-text)}.pill.interrupted,.pill.cancelled{color:var(--warn)}
.secs{display:flex;flex-direction:column;gap:var(--gap)}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:550;font-size:11px;text-transform:uppercase;letter-spacing:.04em}td.n,th.n{text-align:right;font-family:var(--mono)}
.params{display:flex;flex-wrap:wrap;gap:4px}.params span{font:11px var(--mono);background:var(--soft);padding:1px 6px;border-radius:4px;color:var(--mute)}.params b{color:var(--ink);font-weight:600}
.tpl{font-weight:600}.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
pre{background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:7px;overflow:auto;font:12px var(--mono);margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--mute);font:11px var(--font)}
.notice{border-left:3px solid var(--warn);background:var(--soft);padding:8px 12px;border-radius:0 7px 7px 0;font-size:13px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.kpis div{background:var(--soft);padding:8px 10px;border-radius:7px}.kpis small{display:block;color:var(--mute);font-size:11px}
.cadview{height:300px;margin:12px 0;border:1px solid var(--line);border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden}.cadview canvas{width:100%;height:100%;display:block}
</style></head>
<body>
<header class="top"><h1>Gripper Finger Designer</h1>
  <span class="chip" id="meta">...</span>
  <label class="ctl">Theme <select id="selTheme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <a href="/api/export/trials.jsonl">Trials &#8595;</a><a href="/api/export/physical.jsonl">Physical &#8595;</a>
</header>
<div id="app">
<div id="intro">
<div class="card" id="pane-new"><h2>New part</h2><form id="f">
<label>CAD file / images (stored with the job)</label><input type="file" name="part_file">
<label>Task</label><textarea name="task" rows="2" required>pick vial caps off the table and place them in a tray</textarea>
<div class="grid2"><div><label>Shape</label><select name="shape" id="shape"><option value="cylinder">cylinder</option><option value="box">box</option></select></div>
<div><label>Mass (g)</label><input name="mass_g" type="number" step="any" value="5"></div>
<div class="cyl"><label>Diameter (mm)</label><input name="diameter_mm" type="number" step="any" value="31.75"></div>
<div class="cyl"><label>Length (mm)</label><input name="length_mm" type="number" step="any" value="15.7"></div>
<div class="cyl span2"><label>Resting</label><select name="upright"><option value="true">standing on an end</option><option value="false">on its side, axis across the jaws</option></select></div>
<div class="bx" hidden><label>Width along the jaws (mm)</label><input name="width_mm" type="number" step="any" value="10"></div>
<div class="bx" hidden><label>Depth across (mm)</label><input name="depth_mm" type="number" step="any" value="10"></div>
<div class="bx" hidden><label>Height (mm)</label><input name="height_mm" type="number" step="any" value="10"></div>
<div><label>Camera error &sigma; (mm)</label><input name="sigma_mm" type="number" step="any" value="3"></div>
<div><label>Yaw error &sigma; (&deg;)</label><input name="sigma_deg" type="number" step="any" value="8"></div></div>
<details><summary class="mute" style="margin-top:12px;cursor:pointer">Optimizer settings</summary><div class="grid2">
<div><label>Designs to search</label><input name="budget" type="number" value="128"></div>
<div><label>Designs per round</label><input name="batch_size" type="number" value="16"></div>
<div><label>Stop after rounds without gain</label><input name="patience" type="number" value="3"></div>
<div><label>Seed</label><input name="seed" type="number" value="0"></div></div></details>
<p style="margin:14px 0 0"><button>Start optimization</button></p></form></div>
<div class="card" id="pane-jobs"><h2>Jobs</h2><div id="jobs"></div></div>
</div>
<div id="right"><div id="spywrap"><nav class="spy" id="spy" aria-label="Job sections"></nav></div>
<main id="detail"><div class="card mute">Select or start a job.</div></main></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
const $=s=>document.querySelector(s),B=document.body;let cur=null,es=null,sig='';
const api=(u,o)=>fetch(u,o).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(v>.99&&v<1?1:0)+'%';
const mm=v=>v==null?'—':(+v).toFixed(1)+' mm';
const partText=p=>p.shape=='box'?`box ${p.width_mm}×${p.depth_mm}×${p.height_mm} mm`:`cylinder ⌀${p.diameter_mm}×${p.length_mm} mm, ${p.upright?'standing':'lying'}`;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const params=p=>`<div class="params">${Object.entries(p).map(([k,v])=>`<span>${esc(k.replace(/_/g,' '))} <b>${(+v).toFixed(1)}</b></span>`).join('')}</div>`;

function applyPrefs(){const th=store.get('theme')||'auto';
 if(th=='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=th;$('#selTheme').value=th}
$('#selTheme').onchange=e=>{store.set('theme',e.target.value);applyPrefs()};

/* ---- section nav: built from what is on the page; click = snap, scroll = highlight ---- */
let navItems=[];
function buildNav(){navItems=(window._secs||[]).map(x=>({id:'s-'+x.id,t:x.t}));
 $('#spy').innerHTML=!navItems.length?'':navItems.map(n=>`<a href="#${n.id}" data-id="${n.id}">${n.t}</a>`).join('')+'<button class="sec close" onclick="deselect()" title="Close this job">✕ Close job</button>';
 $('#spy').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();goto(a.dataset.id)});spy()}
function goto(id){const el=document.getElementById(id);if(!el)return;setActive(id);el.scrollIntoView({behavior:'smooth',block:'start'})}
function setActive(id){let on=null;$('#spy').querySelectorAll('a').forEach(a=>{const m=a.dataset.id==id;a.classList.toggle('on',m);if(m)on=a});
 if(on){const bar=$('#spy'),l=on.offsetLeft,r=l+on.offsetWidth;if(l<bar.scrollLeft||r>bar.scrollLeft+bar.clientWidth)bar.scrollTo({left:l-40,behavior:'smooth'})}}
let ticking=false;
function spy(){const line=$('.top').offsetHeight+$('#spywrap').offsetHeight+32;let cur2=navItems[0]&&navItems[0].id;
 const atBottom=innerHeight+scrollY>=document.documentElement.scrollHeight-4;
 for(const n of navItems){const el=document.getElementById(n.id);if(el&&el.getBoundingClientRect().top<=line)cur2=n.id}
 if(scrollY<8&&navItems.length)cur2=navItems[0].id;if(atBottom&&navItems.length)cur2=navItems[navItems.length-1].id;setActive(cur2)}
addEventListener('scroll',()=>{if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;spy()})}},{passive:true});
addEventListener('resize',()=>{document.documentElement.style.setProperty('--hh',$('.top').offsetHeight+'px');spy()});

api('/api/meta').then(m=>$('#meta').textContent=`Sim ${m.sim} · ${m.cpus} CPUs`);
$('#shape').onchange=e=>document.querySelectorAll('.cyl,.bx').forEach(el=>el.hidden=el.classList.contains('cyl')!==(e.target.value=='cylinder'));
$('#f').onsubmit=async e=>{e.preventDefault();const r=await api('/api/jobs',{method:'POST',body:new FormData(e.target)});select(r.id);list()};

async function list(){const js=await api('/api/jobs');$('#jobs').innerHTML=js.map(j=>`<div class="job ${j.id==cur?'sel':''}" onclick="pick('${j.id}')">
<b>${esc(j.task.slice(0,44))}</b><span class="pill ${j.status}">${j.status}</span><div class="bar ${j.status}"><i style="width:${j.progress*100}%"></i></div>
<span class="mute mono">${j.n_done}/${j.n_total}${j.best_value!=null?' · best '+pct(j.best_value):''}</span></div>`).join('')||'<span class="mute">No jobs yet</span>'}
function deselect(){cur=null;sig='';if(es)es.close();es=null;window._secs=[];$('#detail').innerHTML='<div class="card mute">Select or start a job.</div>';buildNav();scrollTo(0,0);list()}
function pick(id){id===cur?deselect():select(id)}
function select(id){cur=id;sig='';if(es)es.close();render(true,true);
 es=new EventSource(`/api/jobs/${id}/events`);es.onmessage=()=>{render();list()};es.onerror=()=>{es.close();render();list()}}

function chart(trials){if(!trials.length)return'<p class="mute">Waiting for the first round…</p>';
 const W=640,H=220,L=38,R=10,T=14,Bt=26,n=trials.length;let b=0;const best=trials.map(t=>b=t.kind=='search'?Math.max(b,t.success_rate):b);
 const x=i=>L+i*(W-L-R)/Math.max(1,n-1),y=v=>H-Bt-v*(H-Bt-T);
 const starts=trials.map((t,i)=>i&&t.round!==trials[i-1].round?i:-1).filter(i=>i>0);
 const dot=(t,i)=>{const tip=`<title>#${t.number} round ${t.round} ${t.kind}: ${pct(t.success_rate)}, holds to ${mm(t.capture_radius_mm)}</title>`;
  return t.kind!='search'?`<rect x="${x(i)-4}" y="${y(t.success_rate)-4}" width="8" height="8" transform="rotate(45 ${x(i)} ${y(t.success_rate)})" fill="var(--llm)">${tip}</rect>`
   :`<circle cx="${x(i)}" cy="${y(t.success_rate)}" r="3.5" fill="var(--opt)">${tip}</circle>`};
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Expected success per design, round by round, with the best so far">
 ${[0,.25,.5,.75,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`).join('')}
 ${starts.map(i=>`<line x1="${x(i-.5)}" x2="${x(i-.5)}" y1="${T-10}" y2="${H-Bt}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${x(i-.5)+4}" y="${T}">round ${trials[i].round}</text>`).join('')}
 <text x="${L}" y="${H-6}">design 1</text><text x="${W-R}" y="${H-6}" text-anchor="end">${n}</text>
 <polyline fill="none" stroke="var(--best)" stroke-width="2" points="${best.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>${trials.map(dot).join('')}</svg>
 <div class="legend"><span><i style="background:var(--opt);border-radius:50%"></i>Searched design</span><span><i style="background:var(--llm);transform:rotate(45deg)"></i>Baseline (stock, imprint)</span><span><i style="background:var(--best);height:3px;vertical-align:3px"></i>Best searched so far</span></div>`}
function compare(r){return`<div style="overflow-x:auto"><table><tr><th>Fingers<th class=n>Success<th class=n>Holds every grasp to<th>Success vs camera error &sigma; (mm)</tr>
 ${r.comparison.map(c=>`<tr${c.name=='optimized'?' style="font-weight:600"':''}><td>${esc(c.name)}${c.problems.length?` <span class="mute" title="${esc(c.problems.join('; '))}">(can't be built)</span>`:''}<td class=n>${pct(c.success)}<td class=n>${mm(c.capture_radius_mm)}<td class=mono>${Object.entries(c.curve).sort((a,b)=>a[0]-b[0]).map(([k,v])=>`${k}: ${pct(v)}`).join(' · ')}`).join('')}</table></div>`}

function physTable(j){const by={};j.physical.forEach(p=>(by[p.finger]=by[p.finger]||[]).push(p));
 const rows=Object.entries(by).map(([f,l])=>{const ok=l.filter(p=>p.success).length;return`<tr><td>${esc(f)}<td class=n>${ok}/${l.length}<td class=n>${pct(ok/l.length)}`}).join('');
 return rows?`<table><tr><th>Fingers<th class=n>Successes<th class=n>Rate</tr>${rows}</table><p class="mute">Simulated prediction: ${j.result?pct(j.result.predicted_success):'—'}</p>`:'<p class="mute">No physical trials logged yet.</p>'}
function sections(j){const r=j.result,S=[];
 S.push({id:'overview',t:'Overview',wide:1,col:0,h:`
  <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:16px">${esc(j.task)}</b><span class="pill ${j.status}">${j.status}${j.stage?' · '+j.stage:''}</span></div>
  <div>${['running','queued'].includes(j.status)?`<button class=sec onclick="act('cancel')">Cancel</button>`:''}${['interrupted','cancelled','failed'].includes(j.status)?`<button onclick="act('resume')">Resume</button>`:''}</div></div>
  <div class="bar ${j.status}" style="height:8px"><i style="width:${j.progress*100}%"></i></div>
  <span class="mute">${j.n_done}/${j.n_total} designs · ${esc(partText(j.part))} · ${j.part.mass_g} g · camera error &sigma; ${j.config.sigma_mm} mm, ${j.config.sigma_deg}&deg;</span>${j.error?`<pre>${esc(j.error)}</pre>`:''}
  ${r?`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="big">${pct(r.predicted_success)} <span class="mute" style="font-size:13px;font-weight:400">expected success at &sigma; = ${j.config.sigma_mm} mm · every grasp held to ${mm(r.capture_radius_mm)} off · re-tested with the baselines on a denser grid</span></div>
  ${compare(r)}<p class="mute" style="margin:12px 0 0">Design #${r.trial_number}</p>${params(r.params)}
  <p class="mute" style="margin:12px 0 0">Grasp pose</p><pre>${esc(JSON.stringify(r.grasp_pose,null,1))}</pre>
  <div id="cadview" class="cadview"><span class="mute">Loading 3D preview…</span></div>
  <a href="/api/jobs/${j.id}/scad">Finger CAD (.scad, no mount holes yet) &#8595;</a> <span class="chip">${j.review&&j.review.status=='approved'?'review approved':'DRAFT — not approved for printing'}</span>`:''}`});
 S.push({id:'progress',t:'Progress',col:1,h:chart(j.trials)});
 S.push({id:'candidates',t:'Top designs',col:1,h:`<div style="overflow-x:auto"><table><tr><th>#<th class=n>Round<th>Parameters<th class=n>Success<th class=n>Holds to</tr>
  ${[...j.trials].filter(t=>t.kind=='search').sort((a,b)=>b.success_rate-a.success_rate).slice(0,8).map(t=>`<tr${t.number===j.best_trial?' style="font-weight:600"':''}><td class=mono>${t.number}<td class=n>${t.round}<td>${params(t.params)}<td class=n>${pct(t.success_rate)}<td class=n>${mm(t.capture_radius_mm)}`).join('')}</table></div>`});
 S.push({id:'safety',t:'Review & physical tests',col:0,h:`<p class="notice">Do not mount a printed finger or command the arm until the plant manager / mentor has reviewed clearance and safe operation. Physical tests happen only at CSI with a supervisor.</p>
  <p>Review status: <b>${j.review?j.review.status:'pending'}</b>${j.review&&j.review.reviewer?' by '+esc(j.review.reviewer):''}</p>
  <form onsubmit="return post(event,'review')" class="grid2"><div><label>Reviewer</label><input name=reviewer></div><div><label>Decision</label><select name=status><option>pending<option>approved<option>rejected</select></div><div class=span2><label>Notes</label><input name=notes></div><div class=span2 style="margin-top:10px"><button>Save review</button></div></form>
  <div class="sec-h" style="margin-top:20px">Physical trial log</div>${physTable(j)}
  <form onsubmit="return post(event,'physical')" class="grid2"><div><label>Fingers</label><select name=finger><option>optimized<option>stock<option>imprint</select></div><div><label>Result</label><select name=success><option value=1>success<option value=0>fail</select></div>
  <div><label>Placement error (mm)</label><input name=placement_error_mm type=number step=any></div><div><label>Cycle time (s)</label><input name=cycle_time_s type=number step=any></div>

/* 3D preview: the winning finger's convex pieces from /api/jobs/{id}/finger (gripper frame, mm, z up), the second finger
   mirrored, jaws open, around the part resting on the table: the same geometry the simulator and the CAD file get. */
let _cad=null;
async function mountCad(j){const el=$('#cadview');if(!el)return;
 try{
  const [THREE,{OrbitControls},g]=await Promise.all([import('three'),import('three/addons/controls/OrbitControls.js'),api(`/api/jobs/${j.id}/finger`)]);
  const f=g.finger,[px,py,ph]=g.extent_mm,tip=f.tip_height_mm,pos=[];
  for(const p of f.pieces)for(const t of p.triangles)for(const i of t)pos.push(...p.points[i]);
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({color:0x76b900,roughness:.55,metalness:.1,flatShading:true,side:THREE.DoubleSide});
  const fingers=new THREE.Group();
  for(const sgn of [1,-1]){const m=new THREE.Mesh(geo,mat);m.scale.x=sgn;m.position.x=sgn*g.jaw_open_mm;fingers.add(m);
   const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo,30),new THREE.LineBasicMaterial({color:0x222222}));e.scale.x=sgn;e.position.x=sgn*g.jaw_open_mm;fingers.add(e)}
  const pm=new THREE.MeshStandardMaterial({color:0xcd163f,transparent:true,opacity:.5});
  let part;if(g.part.shape=='cylinder'){const c=new THREE.CylinderGeometry(px/2,px/2,g.part.upright?ph:py,48);if(g.part.upright)c.rotateX(Math.PI/2);part=new THREE.Mesh(c,pm)}
  else part=new THREE.Mesh(new THREE.BoxGeometry(px,py,ph),pm);
  part.position.z=ph/2-tip;
  const span=4*Math.max(px,py,40),table=new THREE.Mesh(new THREE.PlaneGeometry(span,span),new THREE.MeshStandardMaterial({color:0x888888,transparent:true,opacity:.25,side:THREE.DoubleSide}));table.position.z=-tip;
  if(_cad){_cad.stop();_cad=null}
  el.innerHTML='';const W0=el.clientWidth,H0=el.clientHeight;
  const rd=new THREE.WebGLRenderer({antialias:true,alpha:true});rd.setPixelRatio(devicePixelRatio);rd.setSize(W0,H0);el.appendChild(rd.domElement);
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,W0/H0,.1,4000);cam.up.set(0,0,1);
  sc.add(new THREE.HemisphereLight(0xffffff,0x888888,1.4));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(60,-80,100);sc.add(dl);
  sc.add(fingers,part,table);const bb=new THREE.Box3().setFromObject(fingers).union(new THREE.Box3().setFromObject(part)),c=bb.getCenter(new THREE.Vector3()),sz=bb.getSize(new THREE.Vector3()).length();
  cam.position.copy(c).add(new THREE.Vector3(sz*.6,-sz*.9,sz*.35));
  const oc=new OrbitControls(cam,rd.domElement);oc.target.copy(c);oc.update();
  let run=true;(function loop(){if(!run||!el.isConnected)return;rd.render(sc,cam);requestAnimationFrame(loop)})();
  _cad={stop(){run=false;rd.dispose()}};
 }catch(e){el.innerHTML='<span class="mute">3D preview unavailable ('+esc(String(e.message||e))+')</span>'}}
function render(force,jump){if(!cur)return;const want=cur;
 const a=document.activeElement;if(!force&&a&&$('#detail').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
 api('/api/jobs/'+cur).then(j=>{if(cur!==want)return;const s=JSON.stringify([j.status,j.stage,j.n_done,j.result&&1,j.review,j.physical.length,j.meta&&1]);if(!force&&s===sig)return;sig=s;
  const S=sections(j),y=scrollY;window._secs=S;
  $('#detail').innerHTML=`<div class="secs">${S.map(x=>`<div class="card sec ${x.wide?'wide':''}" id="s-${x.id}"><h2>${x.t}</h2>${x.h}</div>`).join('')}</div>`;
  buildNav();if(jump)goto('s-overview');else scrollTo(0,y);if(j.result)mountCad(j)})}
function tog(id,o){const v=JSON.parse(store.get('open')||'{}');v[id]=o;store.set('open',JSON.stringify(v))}
