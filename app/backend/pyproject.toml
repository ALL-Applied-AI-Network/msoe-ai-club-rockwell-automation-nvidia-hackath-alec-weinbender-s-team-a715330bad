[project]
name = "backend"
version = "0.1.0"
description = "Finger Designer API and optimizer worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "anthropic>=0.40",   # only used if ANTHROPIC_API_KEY is set
    "pydantic-settings>=2.8",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "botorch>=0.14",   # batch Bayesian optimisation; its torch comes CPU-only (see the root pyproject.toml)
    "scipy>=1.13",   # convex hulls of the finger pieces
    "cadquery>=2.4",
    "vhacdx>=0.1",
    "trimesh>=4.4",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"   # importable package: app/backend/src/api
